{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<form method="post" novalidate>
  {{ form.hidden_tag() }}
  <p>{{ form.username.label }}<br>{{ form.username() }}</p>
  <p>{{ form.password.label }}<br>{{ form.password() }}</p>
  <button type="submit">Login</button>
</form>
{% endblock %}
